[versions]
arrow = "2.3.0"
coroutines = "1.11.0"
detekt = "2.0.0-alpha.6"
kotest = "6.2.6"
kotlin = "2.4.21"
kotlinter = "5.7.0"

[libraries]
arrow-stack = { module = "io.arrow-kt:arrow-stack", version.ref = "arrow" }
arrow-core = { module = "io.arrow-kt:arrow-core" }
arrow-fx-coroutines = { module = "io.arrow-kt:arrow-fx-coroutines" }
arrow-fx-stm = { module = "io.arrow-kt:arrow-fx-stm" }
arrow-optics = { module = "io.arrow-kt:arrow-optics" }
arrow-resilience = { module = "io.arrow-kt:arrow-resilience" }
kotest-assertions-arrow = { module = "io.kotest:kotest-assertions-arrow", version.ref = "kotest" }
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

[bundles]
arrow = ["arrow-core", "arrow-fx-coroutines", "arrow-resilience"]
test = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-assertions-arrow", "kotlinx-coroutines-test"]

[plugins]
arrow-optics = { id = "io.arrow-kt.optics", version.ref = "arrow" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
